# dot.dnslab.test: DoT on 853 (RFC 7858), the backend ns-dot (probe.dnslab.test answers 10.53.4.4).
# Debian's libnginx-mod-stream loads the stream module from here.
include /etc/nginx/modules-enabled/*.conf;
worker_processes 1;
error_log stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
stream {
    server {
        listen 853 ssl;
        ssl_certificate /certs/dot.pem;
        ssl_certificate_key /certs/dot.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        proxy_pass ns-dot:53;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
