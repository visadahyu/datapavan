# The network resolver's DoT on 853, for Private DNS on "automatic": a certificate for its addresses (10.0.2.3 as
# the emulator sees it, 127.0.0.2 as the computer does), the resolver itself behind (probe.dnslab.test 10.53.5.5).
include /etc/nginx/modules/*.conf;
worker_processes 1;
error_log stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
stream {
    server {
        listen 853 ssl;
        ssl_certificate /certs/resolver.pem;
        ssl_certificate_key /certs/resolver.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        proxy_pass resolver:53;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
