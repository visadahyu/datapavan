# CI for the repository. Runs the same quality gates as a local build.
# All logic lives in scripts/check.sh; this file only prepares the toolchain.
# Actions are pinned by full commit SHA, because tags can be moved.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The NDK version has a single source of truth: android/app/build.gradle.kts.
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk"

      - name: Cache cargo tools and registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('core/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Rust toolchain and cargo tools
        run: |
          # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Quality gates
        run: scripts/check.sh all

      # On a real Android system: the smoke test (overview shown, no INTERNET permission, no crash),
      # then the audit verification, which gives a test fixture app risky access and checks that the
      # audit reports it (scripts/smoke.sh, scripts/verify-audit.sh).
      # The emulator needs 7.4 GB for its data partition; after the build only 5.8 GB are left. The
      # Rust build directory is no longer needed (the APK already holds the library), nor are large
      # preinstalled toolchains this project never uses.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          rm -rf core/target
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            scripts/smoke.sh
            scripts/verify-audit.sh
