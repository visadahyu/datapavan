# CI on the GitHub mirror. Codeberg (Woodpecker) will run the same script once access is granted.
# All logic lives in scripts/check.sh; this file only prepares the toolchain.
# Actions are pinned by full commit SHA, because tags can be moved.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The NDK version has a single source of truth: android/app/build.gradle.kts.
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk"

      - name: Cache cargo tools and registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('core/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Rust toolchain and cargo tools
        run: |
          # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Quality gates
        run: scripts/check.sh all
