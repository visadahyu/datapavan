# CI for the repository. Runs the same quality gates as a local build.
# All logic lives in scripts/check.sh; this file only prepares the toolchain.
# Actions are pinned by full commit SHA, because tags can be moved.
# Fuzzing has its own workflow (fuzz.yml).
name: CI

# A push that changes only documentation or brand files has nothing for CI to check. A tag points at a
# commit that CI has already checked on its branch, so a tag runs nothing.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "brand/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "brand/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main moves only by fast-forward to a commit that already passed CI on its working branch. The
  # same commit would then be checked twice; this job finds the earlier run, and the checks are
  # skipped. A commit pushed to main directly, or a pull request, is always checked.
  already-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            earlier=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" \
              --jq '[.workflow_runs[] | select(.head_branch != "main")] | length')
            if [ "$earlier" -gt 0 ]; then passed=true; fi
          fi
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "This commit already passed CI on a working branch: $passed"

  checks:
    needs: already-passed
    if: needs.already-passed.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The NDK version has a single source of truth: android/app/build.gradle.kts.
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk"

      - name: Cache cargo tools and registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('core/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Rust toolchain and cargo tools
        run: |
          # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      # Gradle and Hugo are published on GitHub, which at times times out anonymous downloads
      # (2026-11-08, three runs lost). They are cached, and fetched with the workflow's token when the
      # cache is empty; the token is given to this step only, and each file is checked against its
      # pinned SHA-256 (scripts/ci-fetch.sh).
      - name: Cache Gradle's distribution and Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            build/tools
          key: downloads-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'scripts/build-site.sh') }}

      - name: Fetch Gradle's distribution and Hugo with the workflow's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch.sh

      - name: Quality gates
        run: scripts/check.sh all

      # On a real Android system: Watch's smoke test (every language, its tunnel on and off, nothing
      # but Watch inside it, scripts/smoke-watch.sh), then the audit app's smoke test (overview shown,
      # no INTERNET permission, no crash),
      # then the audit verification, which gives a test fixture app risky access and checks that the
      # audit reports it, the remediation plan's hand-off, journal and undo with the same fixture, the
      # launcher shortcuts as Android hands them to the launcher, then screenshots in every language with
      # an accessibility check (scripts/smoke.sh, scripts/verify-audit.sh, scripts/verify-plan.sh,
      # scripts/verify-shortcuts.sh, scripts/verify-datapack.sh, scripts/screenshots.sh).
      # The emulator needs 7.4 GB for its data partition; after the build only 5.8 GB are left. The
      # Rust build directory is no longer needed (the APK already holds the library), nor are large
      # preinstalled toolchains this project never uses.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          rm -rf core/target
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen; without a profile the emulator is 320 x 640, smaller than any phone.
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            scripts/smoke-watch.sh
            scripts/smoke.sh
            scripts/verify-audit.sh
            scripts/verify-plan.sh
            scripts/verify-shortcuts.sh
            scripts/verify-datapack.sh
            scripts/screenshots.sh build/screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore
