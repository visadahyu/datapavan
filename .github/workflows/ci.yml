# CI for the repository. Runs the same quality gates as a local build.
# All logic lives in scripts/check.sh; this file only prepares the toolchain.
# Actions are pinned by full commit SHA, because tags can be moved.
# Fuzzing has its own workflow (fuzz.yml).
name: CI

# Every push and pull request runs CI, so that every commit gets a result that the ruleset on main can
# require (ADR 0043). The repository checks, which need no build, run on every push: the documents against
# the code, the published keys, the translations and the website (scripts/check.sh data). The build and
# the emulator checks run when the commit changes what they test, by the rule in scripts/ci-scope.sh. The
# emulator checks run in parallel shards (scripts/emulator-shard.sh), each on an emulator of its own. A
# tag points at a commit that CI has already checked on its branch, so a tag runs nothing.
#
# A check that fails without a change to what it tests is a flake: it goes into docs/ci-flakes.md, with
# the run, the check, the cause and the fix, before the run is repeated.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this push needs. main moves only by fast-forward to a commit that already passed CI on its
  # working branch: that run counts, and nothing runs twice. Otherwise the commit is compared with the
  # nearest earlier commit whose tree passed the build, and with the nearest whose tree passed the emulator
  # checks, in CI runs of pushes (scripts/ci-scope.sh): the build runs unless the trees differ only in
  # documents, and the emulator checks run unless they differ only in what no emulator check reads. A
  # change to the apps, the engine, the scripts or CI itself always runs both; so does a history with no
  # earlier pass.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
      build: ${{ steps.decide.outputs.build }}
      emulator: ${{ steps.decide.outputs.emulator }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            earlier=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
              --jq '[.workflow_runs[] | select(.head_branch != "main")] | length')
            if [ "$earlier" -gt 0 ]; then passed=true; fi
          fi
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "This commit already passed CI on a working branch: $passed"

      - if: steps.lookup.outputs.passed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The rule's table of paths and its choice of an earlier pass, before the rule decides anything.
      - name: The scope rule's tests
        if: steps.lookup.outputs.passed != 'true'
        run: scripts/ci-scope.sh test

      - id: decide
        if: steps.lookup.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-scope.sh decide

  # Checks that need no build, on every push: the bundled datasets' licences, the published keys, the
  # documents against the code and the record (scripts/check-truth.py, which reads the release tags), the
  # translations and the website.
  repository:
    needs: scope
    if: needs.scope.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: hugo-${{ runner.os }}-${{ hashFiles('scripts/build-site.sh') }}

      - name: Fetch Hugo with the workflow's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch.sh hugo

      - name: Repository checks
        run: scripts/check.sh data

  # The build and its gates (scripts/check.sh rust and android). It hands the APKs to the emulator shards.
  build:
    needs: scope
    if: needs.scope.outputs.passed != 'true' && needs.scope.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The NDK version has a single source of truth: android/app/build.gradle.kts.
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk"

      - name: Cache cargo tools and registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('core/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Rust toolchain and cargo tools
        run: |
          # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      # Gradle and Hugo are published on GitHub, which at times times out anonymous downloads
      # (2026-11-08, three runs lost). They are cached, and fetched with the workflow's token when the
      # cache is empty; the token is given to this step only, and each file is checked against its
      # pinned SHA-256 (scripts/ci-fetch.sh).
      - name: Cache Gradle's distribution and Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            build/tools
          key: downloads-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'scripts/build-site.sh') }}

      - name: Fetch Gradle's distribution and Hugo with the workflow's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch.sh

      # The engine's network lab (core/net/tests/netlab.rs, ADR 0044) needs unprivileged user namespaces
      # with a tun device. Ubuntu 24.04 restricts them through AppArmor by default; on this throwaway
      # runner the restriction is lifted, and the tun module loaded if it is not.
      - name: Allow the network lab
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          [ -c /dev/net/tun ] || sudo modprobe tun

      # The repository checks (scripts/check.sh data) run in their own job, above.
      - name: Quality gates
        run: |
          scripts/check.sh rust
          scripts/check.sh android

      - name: Keep the APKs for the emulator shards
        if: needs.scope.outputs.emulator == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build-advanced/outputs/apk/debug/app-debug.apk
            android/app/build-advanced/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  # On a real Android system, in shards that run side by side, each on a freshly booted emulator of its own
  # (scripts/emulator-shard.sh says which check is in which):
  # - watch: Watch's smoke test (every language, its tunnel on and off with every app inside it,
  #   scripts/smoke-watch.sh) and its engine end to end (TCP, UDP, DNS, refused and unreachable
  #   destinations, each flow's owner, a network switch, scripts/verify-watch.sh), its chaining through a
  #   test tool's SOCKS5 proxy on the phone (the tool found, TCP, UDP and lookups through it, a wrong
  #   password refused, nothing direct once it stops, scripts/verify-chain.sh), its connection log (flows
  #   with their bytes, no destination in the clear or in logcat, an earlier day shut while the screen is
  #   locked, the wipe, scripts/verify-log.sh), and its release build as users get it (traffic through it,
  #   each flow's app, the log, its memory budget, scripts/verify-watch-release.sh);
  # - audit: the audit app's smoke test (overview shown, no INTERNET permission, no crash), then the audit
  #   verification, which gives a test fixture app risky access and checks that the audit reports it, the
  #   remediation plan's hand-off, journal and undo with the same fixture, the launcher shortcuts as
  #   Android hands them to the launcher, and the data pack import (scripts/smoke.sh,
  #   scripts/verify-audit.sh, scripts/verify-plan.sh, scripts/verify-shortcuts.sh,
  #   scripts/verify-datapack.sh);
  # - screens: screenshots in every language with an accessibility check (scripts/screenshots.sh).
  # A shard that fails leaves the others running (fail-fast off), so that a repeat runs only the shard that
  # failed. The emulator boots cold each time: the runner can cache a booted snapshot, but it would save
  # under half a minute a shard (the system image is fetched either way), take gigabytes of the
  # repository's cache, and bring the radios back from a saved state, where the network checks' flakes
  # were (docs/ci-flakes.md).
  emulator:
    name: emulator ${{ matrix.shard }}
    needs: [scope, build]
    if: needs.scope.outputs.passed != 'true' && needs.scope.outputs.emulator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [watch, audit, screens]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The test fixture, the test tool and the workload app build with the SDK's tools alone, and the
      # release check signs with apksigner.
      - name: Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Fetch the build's APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: android/app

      # The emulator needs 7.4 GB for its data partition; large preinstalled toolchains this project never
      # uses make room.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen; without a profile the emulator is 320 x 640, smaller than any phone.
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # The runner's emulator listens on its default port: the shard runs only on a serial it is given.
          script: ANDROID_SERIAL=emulator-5554 scripts/emulator-shard.sh ${{ matrix.shard }}

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.shard }}
          path: build/screenshots/
          if-no-files-found: ignore

  # The one result the ruleset on main requires (ADR 0043): it passes when everything this push needed
  # passed, and fails when anything failed, was cancelled or did not run when it had to.
  # The build and the emulator checks are let off only when the scope job said "false" for them: an empty
  # or missing answer needs them. The emulator job's result is its shards' together: success only if every
  # shard passed.
  gate:
    needs: [scope, repository, build, emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          PASSED: ${{ needs.scope.outputs.passed }}
          NEEDS_BUILD: ${{ needs.scope.outputs.build }}
          NEEDS_EMULATOR: ${{ needs.scope.outputs.emulator }}
          REPOSITORY: ${{ needs.repository.result }}
          BUILD: ${{ needs.build.result }}
          EMULATOR: ${{ needs.emulator.result }}
        run: |
          echo "scope: $SCOPE (passed before: $PASSED, needs the build: $NEEDS_BUILD, the emulator: $NEEDS_EMULATOR)"
          echo "repository: $REPOSITORY; build: $BUILD; emulator: $EMULATOR"
          [ "$SCOPE" = success ] || exit 1
          [ "$PASSED" != true ] || exit 0
          [ "$REPOSITORY" = success ] || exit 1
          [ "$NEEDS_BUILD" = false ] || [ "$BUILD" = success ] || exit 1
          [ "$NEEDS_EMULATOR" = false ] || [ "$EMULATOR" = success ] || exit 1
          echo "Everything this push needed passed."
