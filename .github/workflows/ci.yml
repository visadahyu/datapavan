# CI for the repository. Runs the same quality gates as a local build.
# All logic lives in scripts/check.sh; this file only prepares the toolchain.
# Actions are pinned by full commit SHA, because tags can be moved.
# Fuzzing has its own workflow (fuzz.yml).
name: CI

# Every push and pull request runs CI, so that every commit gets a result that the ruleset on main can
# require (ADR 0043). The repository checks, which need no build, run on every push: the documents against
# the code, the published keys, the translations and the website (scripts/check.sh data). The build and
# the emulator checks run when the commit changes what they test, by the rule in scripts/ci-scope.sh. The
# emulator checks run in parallel shards (scripts/emulator-shard.sh), each on an emulator of its own. A
# tag points at a commit that CI has already checked on its branch, so a tag runs nothing.
#
# A check that fails without a change to what it tests is a flake: it goes into docs/ci-flakes.md, with
# the run, the check, the cause and the fix, before the run is repeated.
#
# The WireGuard checks (W7, part 3a, ADR 0035), the cargo lab against the Linux kernel's WireGuard and wireguard-go
# in the build job and the emulator's wireguard shard, run where the scope rule says the WireGuard code or its checks
# changed, and every week whatever changed: main moves only by fast-forward, so no push to it runs them, and the
# runner's kernel, one of the two references, changes without a commit. The weekly run (or one started by hand)
# carries what takes minutes too: a rekey at 120 s, keepalive timing, and a cookie reply under a flood of
# initiations, each through the engine. On CI a check that cannot find its peer fails (WGLAB_REQUIRED=1).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The weekly run and one started by hand have a group of their own, so that a push does not cancel them.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  # What this push needs. main moves only by fast-forward to a commit that already passed CI on its
  # working branch: that run counts, and nothing runs twice. Otherwise the commit is compared with the
  # nearest earlier commit whose tree passed the build, and with the nearest whose tree passed the emulator
  # checks, in CI runs of pushes (scripts/ci-scope.sh): the build runs unless the trees differ only in
  # documents, and the emulator checks run unless they differ only in what no emulator check reads. A
  # change to the apps, the engine, the scripts or CI itself always runs both; so does a history with no
  # earlier pass. The WireGuard checks run unless the commit differs from the nearest earlier one whose run passed
  # them only in what they do not read. The weekly run carries the WireGuard checks alone.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
      build: ${{ steps.decide.outputs.build }}
      emulator: ${{ steps.decide.outputs.emulator }}
      wireguard: ${{ steps.decide.outputs.wireguard }}
      weekly: ${{ steps.decide.outputs.weekly }}
      shards: ${{ steps.decide.outputs.shards }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            earlier=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
              --jq '[.workflow_runs[] | select(.head_branch != "main")] | length')
            if [ "$earlier" -gt 0 ]; then passed=true; fi
          fi
          echo "passed=$passed" >>"$GITHUB_OUTPUT"
          echo "This commit already passed CI on a working branch: $passed"

      - if: steps.lookup.outputs.passed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The rule's table of paths and its choice of an earlier pass, before the rule decides anything.
      - name: The scope rule's tests
        if: steps.lookup.outputs.passed != 'true'
        run: scripts/ci-scope.sh test

      - id: decide
        if: steps.lookup.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            scripts/ci-scope.sh weekly
          else
            scripts/ci-scope.sh decide
          fi

  # Checks that need no build of the product, on every push: the bundled datasets' licences, the published
  # keys, the documents against the code and the record (scripts/check-truth.py, which reads the release
  # tags), the translations and the website; and the lab's gaps probe and fixture (ADR 0048), which build with
  # the SDK's build tools in seconds, their tools' JVM tests and the platform-gaps tables against results.csv.
  # No emulator runs the probe in CI.
  repository:
    needs: scope
    if: needs.scope.outputs.passed != 'true' && needs.scope.outputs.weekly != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: hugo-${{ runner.os }}-${{ hashFiles('scripts/build-site.sh') }}

      - name: Fetch Hugo with the workflow's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch.sh hugo

      - name: Repository checks
        run: scripts/check.sh data

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages for the lab's apps
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: The lab's gaps probe and fixture (ADR 0048)
        run: scripts/check.sh lab

  # The build and its gates (scripts/check.sh rust and android), and the cargo lab against both WireGuard references
  # (scripts/check.sh wglab) where the WireGuard checks run. It hands the APKs to the emulator shards. The weekly run
  # builds Advanced's debug APK alone, for the wireguard shard, and runs the cargo lab with its long checks.
  build:
    needs: scope
    if: needs.scope.outputs.passed != 'true' && needs.scope.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          # The NDK version has a single source of truth: android/app/build.gradle.kts.
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk"

      - name: Cache cargo tools and registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('core/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Rust toolchain and cargo tools
        run: |
          # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          command -v cargo-ndk || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      # Gradle and Hugo are published on GitHub, which at times times out anonymous downloads
      # (2026-11-08, three runs lost). They are cached, and fetched with the workflow's token when the
      # cache is empty; the token is given to this step only, and each file is checked against its
      # pinned SHA-256 (scripts/ci-fetch.sh).
      - name: Cache Gradle's distribution and Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            build/tools
          key: downloads-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'scripts/build-site.sh') }}

      - name: Fetch Gradle's distribution and Hugo with the workflow's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch.sh

      # The engine's network lab (core/net/tests/netlab.rs, ADR 0044) needs unprivileged user namespaces
      # with a tun device. Ubuntu 24.04 restricts them through AppArmor by default; on this throwaway
      # runner the restriction is lifted, and the tun module loaded if it is not. The lab's test of Android's
      # marks (netlab-enter.py --marks) sets them with the runner's iptables, whose modules a namespace cannot
      # load itself: nf_tables, and, where iptables-nft encodes -j MARK through the xtables compatibility
      # layer, as Ubuntu 24.04's iptables 1.8.10 may, nft_compat and xt_mark. Its test of a full send buffer
      # slows a route with tc's token bucket, sch_tbf. Its tests of a listener netd destroyed (ADR 0044, unit
      # 12b) destroy sockets with iproute2's ss -K, which the image has, through the kernel's socket
      # diagnostics, inet_diag and tcp_diag, and their SOCK_DESTROY. Each that cannot be loaded is warned about
      # here, and the test that needs it then fails and says so.
      - name: Allow the network lab
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          [ -c /dev/net/tun ] || sudo modprobe tun
          for module in nf_tables nft_compat xt_mark sch_tbf inet_diag tcp_diag; do
            grep -q "^$module " /proc/modules || sudo modprobe "$module" ||
              echo "::warning::could not load $module: a test of the network lab that needs it may fail"
          done
          command -v iptables || echo "::warning::no iptables on this runner: the lab's test of Android's marks will fail"

      # The repository checks (scripts/check.sh data) run in their own job, above.
      - name: Quality gates
        if: needs.scope.outputs.weekly != 'true'
        run: |
          scripts/check.sh rust
          scripts/check.sh android

      - name: Advanced's debug APK for the wireguard shard
        if: needs.scope.outputs.weekly == 'true'
        timeout-minutes: 30
        run: scripts/check.sh advanced-debug

      # The WireGuard lab's references: the kernel's module, which a container cannot load, and the peers' image,
      # built from pinned sources (spikes/wireguard-core/peer/Dockerfile) and kept in the Actions cache, so that a
      # run fetches nothing when the Dockerfile has not changed. A runner without the module fails here, with its
      # kernel's version.
      - name: The wireguard module
        if: needs.scope.outputs.wireguard == 'true'
        timeout-minutes: 2
        run: |
          sudo modprobe wireguard || { echo "::error title=No wireguard module::modprobe wireguard failed on Linux $(uname -r)"; exit 1; }
          [ -c /dev/net/tun ] || sudo modprobe tun
          echo "the wireguard module $(cat /sys/module/wireguard/version) on Linux $(uname -r)"

      - name: Docker Buildx for the lab's peer image
        if: needs.scope.outputs.wireguard == 'true'
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each fetch inside the build is tried three times; the build itself twice, a minute apart.
      - name: The lab's peer image
        id: peer-image
        if: needs.scope.outputs.wireguard == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spikes/wireguard-core/peer
          load: true
          tags: datapavan-wglab-peer:latest
          cache-from: type=gha,scope=wglab-peer
          cache-to: type=gha,scope=wglab-peer,mode=max

      - name: The lab's peer image, after a minute
        if: needs.scope.outputs.wireguard == 'true' && steps.peer-image.outcome == 'failure'
        timeout-minutes: 2
        run: sleep 60

      - name: The lab's peer image, second attempt
        if: needs.scope.outputs.wireguard == 'true' && steps.peer-image.outcome == 'failure'
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spikes/wireguard-core/peer
          load: true
          tags: datapavan-wglab-peer:latest
          cache-from: type=gha,scope=wglab-peer
          cache-to: type=gha,scope=wglab-peer,mode=max

      - name: WireGuard lab against the kernel's WireGuard and wireguard-go
        if: needs.scope.outputs.wireguard == 'true'
        timeout-minutes: 20
        env:
          WGLAB_REQUIRED: "1"
          WGLAB_NO_BUILD: "1"
          WGLAB_LONG: ${{ needs.scope.outputs.weekly == 'true' && '1' || '' }}
        run: scripts/check.sh wglab

      - name: Keep the lab peers' logs
        if: failure() && needs.scope.outputs.wireguard == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wglab-logs-build
          path: build/wglab/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the APKs for the emulator shards
        if: needs.scope.outputs.emulator == 'true' || needs.scope.outputs.wireguard == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build-advanced/outputs/apk/debug/app-debug.apk
            android/app/build-advanced/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      # The import check draws its QR code with the ZXing jar the app is built with, checked against the verification
      # metadata's SHA-256; the emulator's runner has no Gradle cache, so the build hands it over.
      - name: Keep ZXing's jar for the wireguard shard
        if: needs.scope.outputs.wireguard == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zxing
          path: ~/.gradle/caches/modules-2/files-2.1/com.google.zxing/core/3.5.4/*/core-3.5.4.jar
          if-no-files-found: error
          retention-days: 1

  # On a real Android system, in shards that run side by side, each on a freshly booted emulator of its own
  # (scripts/emulator-shard.sh says which check is in which):
  # - watch: Watch's smoke test (every language, its tunnel on and off with every app inside it,
  #   scripts/smoke-watch.sh) and its engine end to end (TCP, UDP, DNS, refused and unreachable
  #   destinations, each flow's owner, a network switch, scripts/verify-watch.sh), its chaining through a
  #   test tool's SOCKS5 proxy on the phone (the tool found, TCP, UDP and lookups through it, a wrong
  #   password refused, nothing direct once it stops, scripts/verify-chain.sh), its connection log (flows
  #   with their bytes, no destination in the clear or in logcat, an earlier day shut while the screen is
  #   locked, the wipe, scripts/verify-log.sh), and its release build as users get it (traffic through it,
  #   each flow's app, the log, its memory budget, scripts/verify-watch-release.sh);
  # - audit: the audit app's smoke test (overview shown, no INTERNET permission, no crash), then the audit
  #   verification, which gives a test fixture app risky access and checks that the audit reports it, the
  #   remediation plan's hand-off, journal and undo with the same fixture, the launcher shortcuts as
  #   Android hands them to the launcher, and the data pack import (scripts/smoke.sh,
  #   scripts/verify-audit.sh, scripts/verify-plan.sh, scripts/verify-shortcuts.sh,
  #   scripts/verify-datapack.sh);
  # - screens: screenshots in every language with an accessibility check (scripts/screenshots.sh);
  # - blocking: tracker blocking and its undo (W8, part 3a, ADR 0053), the project's blocking fixture against the
  #   blocking lab on the runner's loopback (scripts/verify-blocking.sh, scripts/blocklab.py), a skip failing;
  # - wireguard: Watch's WireGuard upstream and the import of its configurations against the lab's peers of the
  #   kernel's WireGuard on the runner (scripts/verify-wireguard.sh, verify-wireguard-import.sh), only where the
  #   scope rule's WireGuard checks run, and in the weekly run.
  # A shard that fails leaves the others running (fail-fast off), so that a repeat runs only the shard that
  # failed. The emulator boots cold each time: the runner can cache a booted snapshot, but it would save
  # under half a minute a shard (the system image is fetched either way), take gigabytes of the
  # repository's cache, and bring the radios back from a saved state, where the network checks' flakes
  # were (docs/ci-flakes.md).
  emulator:
    name: emulator ${{ matrix.shard }}
    needs: [scope, build]
    if: needs.scope.outputs.passed != 'true' && needs.scope.outputs.shards != '[]' && needs.scope.outputs.shards != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    env:
      # The WireGuard checks fail rather than skip without their peers, and the peers' image is the one built here.
      WGLAB_REQUIRED: ${{ matrix.shard == 'wireguard' && '1' || '' }}
      WGLAB_NO_BUILD: ${{ matrix.shard == 'wireguard' && '1' || '' }}
      # The DNS check fails rather than skips without its lab (W8's fix round, review R-M4).
      DNSLAB_REQUIRED: ${{ matrix.shard == 'dns' && '1' || '' }}
      # The proxies shard (W8, part 2a, ADR 0052): a check that cannot start the proxy lab fails on CI.
      PROXYLAB_REQUIRED: ${{ matrix.shard == 'proxies' && '1' || '' }}
      PROXYLAB_NO_BUILD: ${{ matrix.shard == 'proxies' && '1' || '' }}
      # The blocking shard (W8, part 3a, ADR 0053): a check that cannot start the blocking lab fails on CI.
      BLOCKING_REQUIRED: ${{ matrix.shard == 'blocking' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The test fixture, the test tool and the workload app build with the SDK's tools alone, and the
      # release check signs with apksigner.
      - name: Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Fetch the build's APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: android/app

      # The emulator needs 7.4 GB for its data partition; large preinstalled toolchains this project never
      # uses make room.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The wireguard shard's peers, as in the build job: the module, and the image from the Actions cache.
      - name: The wireguard module
        if: matrix.shard == 'wireguard'
        timeout-minutes: 2
        run: |
          sudo modprobe wireguard || { echo "::error title=No wireguard module::modprobe wireguard failed on Linux $(uname -r)"; exit 1; }
          echo "the wireguard module $(cat /sys/module/wireguard/version) on Linux $(uname -r)"

      - name: Docker Buildx for the lab's peer image
        if: matrix.shard == 'wireguard'
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: The lab's peer image
        id: peer-image
        if: matrix.shard == 'wireguard'
        continue-on-error: true
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spikes/wireguard-core/peer
          load: true
          tags: datapavan-wglab-peer:latest
          cache-from: type=gha,scope=wglab-peer

      - name: The lab's peer image, after a minute
        if: matrix.shard == 'wireguard' && steps.peer-image.outcome == 'failure'
        timeout-minutes: 2
        run: sleep 60

      - name: The lab's peer image, second attempt
        if: matrix.shard == 'wireguard' && steps.peer-image.outcome == 'failure'
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spikes/wireguard-core/peer
          load: true
          tags: datapavan-wglab-peer:latest
          cache-from: type=gha,scope=wglab-peer

      # The dns shard's lab (scripts/dnslab.sh): its images built and every way answering before the emulator starts,
      # so that the build stays out of the emulator's time; dig and Python's cryptography for its clients.
      - name: The DNS lab
        if: matrix.shard == 'dns'
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends dnsutils python3-cryptography
          scripts/dnslab.sh up

      # The proxies shard's lab image, built from pinned sources (scripts/proxylab/Dockerfile) and kept in the Actions
      # cache, as the WireGuard peers' is: tried twice, a minute apart.
      - name: Docker Buildx for the proxy lab's image
        if: matrix.shard == 'proxies'
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: The proxy lab's image
        id: proxylab-image
        if: matrix.shard == 'proxies'
        continue-on-error: true
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/proxylab
          load: true
          tags: datapavan-proxylab:latest
          cache-from: type=gha,scope=proxylab
          cache-to: type=gha,mode=max,scope=proxylab

      - name: The proxy lab's image, after a minute
        if: matrix.shard == 'proxies' && steps.proxylab-image.outcome == 'failure'
        timeout-minutes: 2
        run: sleep 60

      - name: The proxy lab's image, second attempt
        if: matrix.shard == 'proxies' && steps.proxylab-image.outcome == 'failure'
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/proxylab
          load: true
          tags: datapavan-proxylab:latest
          cache-from: type=gha,scope=proxylab
          cache-to: type=gha,mode=max,scope=proxylab

      - name: ZXing's jar for the import check
        if: matrix.shard == 'wireguard'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zxing
          path: ~/.gradle/caches/modules-2/files-2.1/com.google.zxing/core/3.5.4/ci

      # Bounded, so that an emulator that does not shut down once every check passed cannot hold the job to its
      # limit (docs/ci-flakes.md, 2026-11-19).
      - name: Emulator checks
        timeout-minutes: 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen; without a profile the emulator is 320 x 640, smaller than any phone.
          profile: pixel_7
          disable-animations: true
          # The runner's four cores and enough memory for Watch, its tunnel, the workload apps and the audit's scan
          # at once: with the runner's default of two cores the emulator stopped answering adb three times in six
          # runs at the audit's step of the watch shard (2026-11-19, docs/ci-flakes.md). The local AVDs have four.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # The runner's emulator listens on its default port: the shard runs only on a serial it is given. Once the
          # shard passed, the emulator is stopped within a bound (scripts/emulator-stop.sh, docs/ci-flakes.md).
          script: |
            ANDROID_SERIAL=emulator-5554 scripts/emulator-shard.sh ${{ matrix.shard }}
            scripts/emulator-stop.sh emulator-5554

      - name: Keep the lab peers' logs
        if: failure() && matrix.shard == 'wireguard'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wglab-logs-emulator
          path: build/wglab/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the DNS lab's logs
        if: failure() && matrix.shard == 'dns'
        run: |
          mkdir -p build/dnslab
          for service in relay target-a target-b doh dot resolver censor; do
            scripts/dnslab.sh log "$service" >"build/dnslab/$service.log" 2>&1 || true
          done
          scripts/dnslab.sh stop || true

      - name: Upload the DNS lab's logs
        if: failure() && matrix.shard == 'dns'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dnslab-logs-emulator
          path: build/dnslab/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the proxy lab's logs
        if: failure() && matrix.shard == 'proxies'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxylab-logs-emulator
          path: build/proxylab/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.shard }}
          path: build/screenshots/
          if-no-files-found: ignore

  # The one result the ruleset on main requires (ADR 0043): it passes when everything this push needed
  # passed, and fails when anything failed, was cancelled or did not run when it had to.
  # The build and the emulator checks are let off only when the scope job said "false" for them: an empty
  # or missing answer needs them. The emulator job's result is its shards' together: success only if every
  # shard passed. The weekly run needs no repository checks.
  gate:
    needs: [scope, repository, build, emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          PASSED: ${{ needs.scope.outputs.passed }}
          NEEDS_BUILD: ${{ needs.scope.outputs.build }}
          NEEDS_EMULATOR: ${{ needs.scope.outputs.emulator }}
          NEEDS_WIREGUARD: ${{ needs.scope.outputs.wireguard }}
          WEEKLY: ${{ needs.scope.outputs.weekly }}
          REPOSITORY: ${{ needs.repository.result }}
          BUILD: ${{ needs.build.result }}
          EMULATOR: ${{ needs.emulator.result }}
        run: |
          echo "scope: $SCOPE (passed before: $PASSED, needs the build: $NEEDS_BUILD, the emulator: $NEEDS_EMULATOR, WireGuard: $NEEDS_WIREGUARD, weekly: $WEEKLY)"
          echo "repository: $REPOSITORY; build: $BUILD; emulator: $EMULATOR"
          [ "$SCOPE" = success ] || exit 1
          [ "$PASSED" != true ] || exit 0
          [ "$WEEKLY" = true ] || [ "$REPOSITORY" = success ] || exit 1
          [ "$NEEDS_BUILD" = false ] || [ "$BUILD" = success ] || exit 1
          { [ "$NEEDS_EMULATOR" = false ] && [ "$NEEDS_WIREGUARD" = false ]; } || [ "$EMULATOR" = success ] || exit 1
          echo "Everything this push needed passed."
