[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Pinned above what activity-compose pulls in transitively: older lifecycle lint checks
# use APIs the current Lint no longer has, so they would silently be skipped.
lifecycle = "2.11.0"
# Already in the graph through Compose; declared because the manifest references its provider.
startup = "1.1.1"
junit = "4.13.2"
# W7, part 2: the QR code of a WireGuard configuration, decoded in an isolated process (ADR 0035, question 10).
zxing = "3.5.4"
# W8, part 1: DoH and Oblivious DoH over Android's own TLS (Conscrypt) with HTTP/2 (ADR 0042, "How it is built", point 1).
okhttp = "5.5.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
# Already in the graph through Activity; declared because Watch's screen keeps the import's confirmation in a
# ViewModel across its recreation (W7, part 2, fix round).
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
