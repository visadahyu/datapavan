[package]
name = "datapavan-watch-jni"
description = "Thin JNI bridge between Datapavan Watch and datapavan-net. Allowed unsafe code, like datapavan-jni."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "datapavan_watch"
crate-type = ["cdylib"]

[dependencies]
datapavan-net = { path = "../net" }
jni = { version = "0.22.4", default-features = false }
# fcntl, to make sure the tunnel's descriptor does not block.
libc = "0.2"

[lints.rust]
# JNI exports and the hand-over of the tunnel's descriptor are unsafe; keep every block documented.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
