[package]
name = "datapavan-engine"
description = "Platform-independent Datapavan engine. Contains no unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Ed25519 for signed data packs (ADR 0017): no dependencies of its own. Built for size ("opt_size": its field
# arithmetic is called, not inlined everywhere; W8's fix round): a pack's signature is checked when the pack is read,
# never per packet, and the check stays a few tens of microseconds (measured: ADR 0042, "The fix round").
ed25519-compact = { version = "2.6.0", default-features = false, features = ["opt_size"] }

[lints]
workspace = true
