[workspace]
resolver = "3"
members = ["engine", "jni", "net", "watch-jni"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/visadahyu/datapavan"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# A panic ends the process instead of continuing in an unknown state. For the VPN this means
# fail-closed under Android's lockdown mode; see docs/decisions/0006.
panic = "abort"
# Integer overflow in a packet or DEX parser must be a crash, never a silent wrap-around.
overflow-checks = true
strip = "symbols"
debug = false
