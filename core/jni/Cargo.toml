[package]
name = "datapavan-jni"
description = "Thin JNI bridge between the Android app and datapavan-engine. The only crate allowed to use unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "datapavan"
crate-type = ["cdylib"]

[dependencies]
datapavan-engine = { path = "../engine" }
jni = { version = "0.22.4", default-features = false }

[lints.rust]
# JNI exports are inherently unsafe extern functions; keep every unsafe block documented.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
