[package]
name = "datapavan-net"
description = "Datapavan Watch's packet engine: the forwarder of ADR 0012. Contains no unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# One event loop on one thread (docs/VPN.md, "Battery"): the current-thread runtime, with IO and timers.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

# Inflates one block of the organisation table at a time (ADR 0036): pure Rust, MIT.
miniz_oxide = "0.9.1"

# Read the server name of a QUIC Initial packet (W3, RFC 9001 5): AES removes its header protection, and
# under AES-GCM below its payload's; HKDF over SHA-256 derives its keys. Pure Rust, MIT or Apache-2.0, from
# RustCrypto, all with no default features (no allocator, no random numbers). `hkdf` brings `hmac`, of
# the same digest traits as `sha2` (digest 0.11); their review is in ADR 0044's note on unit 9b, fix
# round 2.
aes = { version = "0.9.4", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
# AES-GCM's tag for the QUIC Initial and Retry packets that tell a stand-in's answers apart (ADR 0044,
# unit 9b), and for the hellos that name a flow: RustCrypto's AEAD on the `aes` above, with no default
# features (no allocator, no random numbers). Apache-2.0 OR MIT. Its review is in ADR 0044's note on
# unit 9b, fix round 1.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }

# The ICMP errors that answer a mapping's datagrams (ADR 0044, decision 1): `IP_RECVERR` and
# `IPV6_RECVERR`, and the socket's error queue read with `recvmsg`, behind safe functions. MIT. Only the
# socket functions ("net"), and the scatter-gather reads `recvmsg` sits behind ("uio"), and since W5's
# first part `clock_gettime(CLOCK_BOOTTIME)` ("time", which brings no other crate) for the DNS caches.
nix = { version = "0.31.3", default-features = false, features = ["net", "poll", "time", "uio"] }
# Already in the lockfile through tokio; `all` gives TCP_NOTSENT_LOWAT, with which a reset waits for the bytes
# already given to a side (engine/tcp.rs, `drain`).
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
# Checks the packets the engine builds against an independent implementation, in tests only.
etherparse = "0.21.0"
# Tokio's paused time, for the tests of the log's timer while the phone sleeps (finding 4): a feature of
# the tokio above, no other crate.
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }

[lints]
workspace = true
